<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arivozhi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Tamil:wght@100..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <div class="title-row">
      <h1 class="title">அறிவொழி</h1>
      <span class="status-dot" id="statusDot"></span>
    </div>

    <label class="setting">
      <span>Autocomplete</span>
      <input type="checkbox" id="settingLive" />
      <span class="toggle"></span>
    </label>

    <label class="setting">
      <span>Memory</span>
      <input type="checkbox" id="settingMemory" />
      <span class="toggle"></span>
    </label>

    <button id="btnClear" class="btn btn-danger">Reset</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
